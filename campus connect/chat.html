<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
        <title>Chat App</title>
        <link rel="stylesheet" href="chat.css" />
    </head>
    <body>
        <div class="person-selector">
            <button class="button person-selector-button active-person" id="wajiha-selector">Wajiha</button>
            <button class="button person-selector-button" id="fahmida-selector">Fahmida</button>
        </div>
        <div class="chat-container">
            <h2 class="chat-header">Wajiha chatting...</h2>

            <div class="chat-messages">
                <div class="message pink-bg">
                    <div class="message-sender">Wajiha</div>
                    <div class="message-text">Hey Fahmida, what's up?</div>
                    <div class="message-timestamp">10:30 AM</div>
                </div>
                <div class="message blue-bg">
                    <div class="message-sender">Fahmida</div>
                    <div class="message-text">Not much, just living the dream. How about you?</div>
                    <div class="message-timestamp">10:35 AM</div>
                </div>
            </div>

            <form class="chat-input-form">
                <input type="text" class="chat-input" required placeholder="Type here, Wajiha..." />
                <button type="submit" class="button send-button">Send</button>
            </form>
            <button class="button clear-chat-button">Clear Chat</button>
        </div>

        <script> src="chat.js"</script>
    </body>
</html>
