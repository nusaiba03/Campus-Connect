<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Connect Reset Password</title>
  <link rel="stylesheet" type="text/css" href="login.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>

  <div class="container">
    <div class="wrapper" id="reset-password-form" >
      <form action="/" onsubmit="return validateForm()" method="POST" class="form">
       <div class="heading">
          <h1>Reset Your Password</h1>     
       </div>        
       <div class="input-box">
         <input type="text" name="username" placeholder="Username" required>
         <i class='bx bxs-user' ></i>
       </div>
       <div class="input-box">
        <input type="password" name="newPassword" placeholder="Enter New Password" required>
        <i class='bx bxs-lock-alt'></i>
       </div>
       <div class="input-box">
        <input type="password" id="confirmPassword" placeholder="Re-Enter Password" required>
        <i class='bx bxs-lock-alt'></i>
       </div>
       <button type="submit" class="btn"><a class="a" href="login.html">Update Password</a></button>
      </form>
    </div>
  </div>

  </body>
</html>
