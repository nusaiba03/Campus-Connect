<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Connect Registration</title>
  <link rel="stylesheet" type="text/css" href="login.css">
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

</head>

<body>

  <div class="container">
    <div class="wrapper" id="register-form" >
      <form action="/registered" onsubmit="return validateForm()" method="POST"  class="form">
       <div class="heading">
          <h1><a href="login.html">Login</a></h1>
          <span>|</span>
          <h1><a href="register.html">Register</a></h1>     
       </div>        
       <div class="input-box">
         <input type="text" name="email" name="email" placeholder="Email" required>
         <i class='bx bxs-email'></i>
       </div>
       <div class="input-box">
         <input type="text" name="username" placeholder="Username" required>
         <i class='bx bxs-user' ></i>
       </div>
       <div class="input-box">
        <input type="password" name="password" placeholder="Password" required>
        <i class='bx bxs-lock-alt'></i>
       </div>
       <div class="input-box">
        <input type="password" name="confirmPassword" placeholder="Re-Enter Password" required>
        <i class='bx bxs-lock-alt'></i>
       </div>
       <div class="remember-forgot">
        <label><input type="checkbox">Remember Me</label>
       </div>
       <button type="submit" class="btn"><a class="a" href="login.html">Register</a></button>
      </form>

    </div>
  </div>

  </body>
</html>
