<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Page</title>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />
  <!-- CSS -->
  <link rel="stylesheet" href="profile.css" />
  <link rel="stylesheet" href="todo.css" />
</head>
<body>
  <div class="header_wrapper">
    <header></header>
    <div class="cols_container">
      <div class="left_col">
        <div class="img_container">
          <img src="../img/user1.jpg" alt="Loren Jones" />
          <span></span>
        </div>
        <h2>Anna Smith</h2>
        <p>BSc Hons Computer Science</p>
        <p>2nd Year Student</p>

        <!-- Profile UL -->
        <ul class="profile">
          <li><span>30</span>connections</li>
          <li><span>32</span>Following</li>
        </ul>

        <div class="content">
          <p>
            Hi, I'm Loren and im currently studying computer science,<br> but I have an interest in dance and music too.
          </p>

          <!-- Social UL -->
          <ul class="profile social">
            <li><i class="fab fa-twitter"></i></li>
            <li><i class="fab fa-tiktok"></i></li>
            <li><i class="fab fa-instagram"></i></li>
            <li><i class="fab fa-snapchat"></i></li>
          </ul>
        </div>
      </div>
      <div class="right_col">
        <nav>
          <!-- Navigation UL -->
          <ul class="navigation">
            <li><a href="../home/home.html">home</a></li>
            <li><a href="../calendar/calendar.html">calendar</a></li>
            <li><a href="../societies/societies.html">societies</a></li>
            <li><a href="../chat/chat.html">groups</a></li>
            <li><a href="../help/help.html">help</a></li>
            <li><a href="../contactform/contactform.html">contact</a></li>
          </ul>
          <button>Follow</button>
        </nav>

        <div class="calendar">
          <img src="../img/calender.jpeg" alt="Photo" />
          <br>

          <div class="todo">
            <h2>TO-DO LIST<img src="../img/icon.png"></h2>
            <div class="row">
              <input type="text" id="input-box" placeholder="Add your text">
              <button onclick="addTask()">Add</button>
            </div>
            <!-- To-Do List UL -->
            <ul class="todo-list" id="list-container">
              <!-- <li class="checked">TASK1</li>
              <li>TASK2</li>
              <li>TASK3</li> -->
            </ul>
          </div>

          <!-- JavaScript -->
          <script>
            const inputBox = document.getElementById("input-box");
            const listContainer = document.getElementById("list-container");

            function addTask() {
              if (inputBox.value === '') {
                alert("You must write something!");
              } else {
                let li = document.createElement("li");
                li.innerHTML = inputBox.value;
                listContainer.appendChild(li);
                let span = document.createElement("span");
                span.innerHTML = "\u00d7";
                li.appendChild(span);
              }
              inputBox.value = "";
              saveData();
            }

            listContainer.addEventListener("click", function (e) {
              if (e.target.tagName == "LI") {
                e.target.classList.toggle("checked");
                saveData();
              } else if (e.target.tagName == "SPAN") {
                e.target.parentElement.remove();
                saveData();
              }
            }, false);

            function saveData() {
              localStorage.setItem("data", listContainer.innerHTML);
            }

            function showTask() {
              listContainer.innerHTML = localStorage.getItem("data");
            }
            showTask();
          </script>

        </div>
      </div>
    </div>
  </div>
</body>
</html>
