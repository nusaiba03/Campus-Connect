<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat App</title>
    <link rel="stylesheet" href="chat.css" />
  </head>
  <body>
    <div class="nav">
        <header>
            <h1>Campus Connect</h1>
            <img src="../img/cc-modified.png" alt="Campus Connect Logo">
        </header>
        <nav id="left-nav">
            <ul>
                <li><a href="../home/home.html">Home</a></li>
            <li><a href="../chat/chat.html">Chat </a></li>
            <li><a href="../societies/societies.html">Societies</a></li>
            <li><a href="../profile/profile.html">Profile</a></li>
            <li><a href="../calendar/calendar.html">Calendar</a></li>
            <li><a href="../help/help.html">Help</a></li>
            <li><a href="../contactform/contactform.html">Contact</a></li>
            </ul>
        </nav>
    </div>
    <!-- Person selector: this contains buttons for user to select whether to chat as Wajiha or Fahmida -->
    <div class="person-selector">
      <button class="button person-selector-button active-person" id="wajiha-selector">Wajiha</button>
      <button class="button person-selector-button" id="fahmida-selector">Fahmida</button>
    </div>
    <div class="chat-container">
      <h2 class="chat-header">Wajiha chatting...</h2>

      <div class="chat-messages">
        <div class="message blue-bg">
          <div class="message-sender">Wajiha</div>
          <div class="message-text">Hey Fahmida, what's up?</div>
          <div class="message-timestamp">10:30 AM</div>
        </div>
        <div class="message pink-bg">
          <div class="message-sender">Fahmida</div>
          <div class="message-text">Not much, how about you?</div>
          <div class="message-timestamp">10:35 AM</div>
        </div>
      </div>

      <form class="chat-input-form">
        <input type="text" class="chat-input" required placeholder="Type here, Wajiha..." />
        <button type="submit" class="button send-button">Send</button>
      </form>
      <button class="button clear-chat-button">Clear Chat</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
